name: Credential Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for privileged credentials
        run: python3 tools/check_exposed_credentials.py

  simulator:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCOUT_DERIVED_DATA_PATH: ${{ runner.temp }}/ScoutCaptureDerivedData
      SCOUT_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro
      CODE_SIGNING_ALLOWED: 'NO'
    steps:
      - uses: actions/checkout@v4
      - name: Run refactor smoke tests
        run: tools/run_refactor_smoke.sh
      - name: Build Release simulator app
        run: |
          xcodebuild -project ScoutCapture.xcodeproj -scheme ScoutCapture \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$SCOUT_DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check Release app for privileged credentials
        run: |
          python3 tools/check_exposed_credentials.py \
            --app-bundle "$SCOUT_DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator/ScoutCapture.app"
