name: Report Package Worker

on:
  workflow_dispatch:
    inputs:
      tenant_comparison_request_id:
        description: "Optional authorized on-demand tenant comparison request UUID."
        required: false
        type: string
      reviewed_report_request_id:
        description: "Optional authorized on-demand reviewed report request UUID."
        required: false
        type: string
      reviewed_content_package_id:
        description: "Optional later ready automatic package for a current copy of an already-reviewed visit."
        required: false
        type: string
      session_id:
        description: "Optional ScoutCapture session UUID to process. Empty runs the poll worker."
        required: false
        type: string
      snapshot_id:
        description: "Optional triggering session_snapshots UUID. Used for trace logging; poll mode still dedupes to the latest completed sealed snapshot for the session."
        required: false
        type: string
      suppress_report_email:
        description: "Suppress report-ready email for an explicit correction run. Normal generation keeps its existing email setting."
        required: false
        type: boolean
        default: false
      trigger_source:
        description: "Optional source label for diagnostics."
        required: false
        default: "manual"
        type: string
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: report-package-worker-${{ inputs.reviewed_report_request_id || inputs.tenant_comparison_request_id || inputs.session_id || 'poll' }}
  cancel-in-progress: false

jobs:
  report-package-worker:
    name: Process completed ScoutCapture snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.session_id == '89a8ec2a-246c-43f0-8db8-e871948e9aa7' &&
      inputs.snapshot_id == '523d1114-df8d-49c8-a469-8306253bcede' &&
      inputs.suppress_report_email == true &&
      inputs.reviewed_report_request_id == '' &&
      inputs.reviewed_content_package_id == '' &&
      inputs.tenant_comparison_request_id == ''
    env:
      SUPABASE_URL: ${{ secrets.SCOUT_DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_DEV_SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
      REPORTS_PORTAL_BASE_URL: ${{ secrets.REPORTS_PORTAL_BASE_URL }}
      REPORT_EMAIL_REPLY_TO: ${{ secrets.REPORT_EMAIL_REPLY_TO }}
      REPORT_EMAIL_NOTIFICATIONS_ENABLED: ${{ inputs.suppress_report_email == true && 'false' || vars.REPORT_EMAIL_NOTIFICATIONS_ENABLED || 'true' }}
      REPORT_EMAIL_ALLOWLIST: ${{ vars.REPORT_EMAIL_ALLOWLIST || '' }}
      REPORT_WORKER_SESSION_ID: ${{ inputs.session_id || '' }}
      REVIEWED_REPORT_REQUEST_ID: ${{ inputs.reviewed_report_request_id || '' }}
      REVIEWED_CONTENT_PACKAGE_ID: ${{ inputs.reviewed_content_package_id || '' }}
      TENANT_COMPARISON_REQUEST_ID: ${{ inputs.tenant_comparison_request_id || '' }}
      REPORT_WORKER_SNAPSHOT_ID: ${{ inputs.snapshot_id || '' }}
      REPORT_WORKER_TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::error::SCOUT_DEV_SUPABASE_URL and SCOUT_DEV_SUPABASE_SERVICE_ROLE_KEY secrets are required."
            exit 1
          fi

      - name: Finish background uploads in Test Org
        if: inputs.reviewed_report_request_id == '' && inputs.tenant_comparison_request_id == '' && (github.event_name == 'schedule' || inputs.session_id == '')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --max-time 120 \
            --request POST \
            --header "x-scoutcapture-service-key: ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL%/}/functions/v1/background-upload-handoff"

      - name: Build report worker image
        run: docker build -f web-contract/report-production/Dockerfile -t scoutcapture-report-worker:report-package .

      - name: Runtime preflight
        run: docker run --rm scoutcapture-report-worker:report-package --runtime-check --pretty --require-heif

      - name: Process completed sealed snapshots
        shell: bash
        run: |
          set -euo pipefail
          worker_args=(
            --allow-remote-validation
            --expected-project-ref chlvazmtucoszicehtnm
            --retention-mode dry-run
            --pretty
          )
          if [[ -n "${REVIEWED_CONTENT_PACKAGE_ID}" && -z "${REVIEWED_REPORT_REQUEST_ID}" ]]; then
            echo "::error::A reviewed content package requires a reviewed report request."
            exit 1
          fi
          if [[ -n "${REVIEWED_REPORT_REQUEST_ID}" ]]; then
            worker_args+=(--reviewed-report-request-id "${REVIEWED_REPORT_REQUEST_ID}")
            if [[ -n "${REVIEWED_CONTENT_PACKAGE_ID}" ]]; then
              worker_args+=(--reviewed-content-package-id "${REVIEWED_CONTENT_PACKAGE_ID}")
            fi
          elif [[ -n "${TENANT_COMPARISON_REQUEST_ID}" ]]; then
            worker_args+=(--tenant-comparison-request-id "${TENANT_COMPARISON_REQUEST_ID}")
          elif [[ -n "${REPORT_WORKER_SESSION_ID}" ]]; then
            echo "Report worker trigger source: ${REPORT_WORKER_TRIGGER_SOURCE}"
            echo "Restricting worker to session_id=${REPORT_WORKER_SESSION_ID}"
            echo "Trigger snapshot_id=${REPORT_WORKER_SNAPSHOT_ID:-none}; worker will process the explicit completed sealed snapshot."
            if [[ -z "${REPORT_WORKER_SNAPSHOT_ID:-}" ]]; then
              echo "::error::REPORT_WORKER_SNAPSHOT_ID is required when REPORT_WORKER_SESSION_ID is supplied."
              exit 1
            fi
            worker_args+=(--session-id "${REPORT_WORKER_SESSION_ID}" --snapshot-id "${REPORT_WORKER_SNAPSHOT_ID}" --allow-session-id "${REPORT_WORKER_SESSION_ID}")
          else
            echo "No session_id input supplied; running all-org completed sealed snapshot poll."
            worker_args+=(--poll-once)
          fi

          docker run --rm \
            -e SUPABASE_URL \
            -e SUPABASE_SERVICE_ROLE_KEY \
            -e RESEND_API_KEY \
            -e REPORT_EMAIL_FROM \
            -e REPORTS_PORTAL_BASE_URL \
            -e REPORT_EMAIL_REPLY_TO \
            -e REPORT_EMAIL_NOTIFICATIONS_ENABLED \
            -e REPORT_EMAIL_ALLOWLIST \
            scoutcapture-report-worker:report-package \
              "${worker_args[@]}"
